name: Verify packages

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core_tests:
    name: Core unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/pulse_slab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter SDK for workspace resolution
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test benchmark example ../../tools
      - name: Analyze core package
        run: dart analyze
      - name: Run VM unit and integration tests
        run: dart test
      - name: Run core developer example
        run: dart run example/pulse_slab_core_example.dart
      - name: Run Chrome portability integration test
        run: dart test -p chrome test/web_portability_test.dart

  persistence_io_tests:
    name: Native persistence I/O tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: packages/pulse_slab_persistence_io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter SDK for workspace resolution
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example
      - name: Analyze persistence I/O package
        run: dart analyze
      - name: Run VM unit and integration tests
        run: dart test
      - name: Run persistence I/O developer example
        run: dart run example/file_store_persistence_example.dart

  persistence_io_platform_tests:
    name: Native persistence I/O platform tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    defaults:
      run:
        working-directory: packages/pulse_slab_persistence_io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter SDK for workspace resolution
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example
      - name: Analyze persistence I/O package
        run: dart analyze
      - name: Run VM unit and integration tests
        run: dart test

  generator_tests:
    name: Generator source and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/pulse_slab_generator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter SDK for workspace resolution
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example
      - name: Analyze generator
        run: dart analyze
      - name: Verify checked-in generated source
        run: |
          dart run build_runner build
          git diff --exit-code -- example/sensor_state.g.dart test/fixtures/all_scalar_record.g.dart test/fixtures/wide_record.g.dart
      - name: Run generator unit and generated-source tests
        run: dart test
      - name: Run generated Chrome portability test
        run: dart test -p chrome test/generated_web_portability_test.dart
      - name: Run generated example
        run: dart run example/main.dart

  flutter_adapter_tests:
    name: Flutter adapter unit and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/pulse_slab_flutter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example
      - name: Analyze Flutter adapter
        run: flutter analyze
      - name: Run Flutter adapter tests
        run: flutter test --no-pub

  flutter_minimal_example_tests:
    name: Flutter minimal example tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/pulse_slab_flutter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Verify example formatting
        run: dart format --output=none --set-exit-if-changed example
      - name: Analyze minimal Flutter example
        run: flutter analyze example
      - name: Run minimal Flutter example test
        run: flutter test --no-pub example/test/widget_test.dart

  flutter_telemetry_demo_tests:
    name: Flutter telemetry integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/pulse_slab_flutter/demo/telemetry
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze telemetry example
        run: flutter analyze
      - name: Run telemetry integration tests
        run: flutter test --no-pub
      - name: Build telemetry example for web
        run: flutter build web

  coverage:
    name: Coverage report
    needs:
      - core_tests
      - persistence_io_tests
      - persistence_io_platform_tests
      - flutter_adapter_tests
      - flutter_minimal_example_tests
      - flutter_telemetry_demo_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: dart pub get
      - name: Collect core coverage
        working-directory: packages/pulse_slab
        run: dart test --coverage=coverage
      - name: Convert core coverage to LCOV
        working-directory: packages/pulse_slab
        run: >-
          dart run coverage:format_coverage --lcov --in=coverage
          --out=coverage/lcov.info --package=. --report-on=lib
      - name: Collect persistence I/O coverage
        working-directory: packages/pulse_slab_persistence_io
        run: dart test --coverage=coverage
      - name: Convert persistence I/O coverage to LCOV
        working-directory: packages/pulse_slab_persistence_io
        run: >-
          dart run coverage:format_coverage --lcov --in=coverage
          --out=coverage/lcov.info --package=. --report-on=lib
      - name: Collect Flutter adapter coverage
        working-directory: packages/pulse_slab_flutter
        run: flutter test --no-pub --coverage
      - name: Write coverage table to the job summary
        run: |
          dart run tools/coverage_summary.dart \
            --input pulse_slab=packages/pulse_slab/coverage/lcov.info \
            --input pulse_slab_persistence_io=packages/pulse_slab_persistence_io/coverage/lcov.info \
            --input pulse_slab_flutter=packages/pulse_slab_flutter/coverage/lcov.info \
            --output coverage/summary.md
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.sha }}
          if-no-files-found: error
          path: |
            packages/pulse_slab/coverage/lcov.info
            packages/pulse_slab_persistence_io/coverage/lcov.info
            packages/pulse_slab_flutter/coverage/lcov.info
            coverage/summary.md

  package_snapshot:
    name: Publication package snapshot
    needs:
      - coverage
      - generator_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build isolated publication snapshot
        run: dart tools/prepare_publish_packages.dart
      - name: Verify publication snapshot policy
        run: |
          test -f publish/packages/pulse_slab/example/pulse_slab_core_example.dart
          test -f publish/packages/pulse_slab/example/README.md
          test -f publish/packages/pulse_slab_persistence_io/example/file_store_persistence_example.dart
          test -f publish/packages/pulse_slab_persistence_io/example/README.md
          test -f publish/packages/pulse_slab_flutter/example/lib/main.dart
          test -f publish/packages/pulse_slab_flutter/example/README.md
          test ! -d publish/packages/pulse_slab_flutter/example/test
          test ! -d publish/packages/pulse_slab_flutter/demo
          test -f publish/packages/pulse_slab_generator/example/main.dart
          test -f publish/packages/pulse_slab_generator/example/README.md
          test -f publish/packages/pulse_slab_generator/build.yaml
          for package in pulse_slab pulse_slab_persistence_io pulse_slab_generator pulse_slab_flutter; do
            ! find "publish/packages/$package/example" -type d \( \
              -name benchmark -o \
              -name fixtures -o \
              -name integration_test -o \
              -name test -o \
              -name tool \
            \) -print -quit | grep -q .
            ! find "publish/packages/$package/example" -type f \( \
              -name test.dart -o \
              -name '*_test.dart' \
            \) -print -quit | grep -q .
          done
          assert_no_empty_leading_unreleased() {
            local changelog="$1"
            awk '
              /^##[[:space:]]/ && !seen_level_two {
                seen_level_two = 1
                empty_leading_unreleased = ($0 ~ /^##[[:space:]]+Unreleased[[:space:]]*$/)
                next
              }
              {
                if (empty_leading_unreleased) {
                  if ($0 ~ /^[[:space:]]*$/) {
                    next
                  }
                  if ($0 ~ /^#{1,2}[[:space:]]/) {
                    exit 1
                  }
                  empty_leading_unreleased = 0
                }
              }
              END {
                if (empty_leading_unreleased) {
                  exit 1
                }
              }
            ' "$changelog"
          }
          for package in pulse_slab pulse_slab_persistence_io pulse_slab_generator pulse_slab_flutter; do
            changelog="publish/packages/$package/CHANGELOG.md"
            if ! assert_no_empty_leading_unreleased "$changelog"; then
              echo "Staged $package changelog begins with an empty Unreleased section." >&2
              exit 1
            fi
          done
      - name: Copy publication snapshot outside the Git checkout
        env:
          PUBLISH_WORKSPACE: ${{ runner.temp }}/pulse-slab-publish
        run: |
          set -euo pipefail
          rm -rf "$PUBLISH_WORKSPACE"
          mkdir -p "$PUBLISH_WORKSPACE"
          cp -a publish/. "$PUBLISH_WORKSPACE/"
          test -f "$PUBLISH_WORKSPACE/pubspec.yaml"
          test -f "$PUBLISH_WORKSPACE/packages/pulse_slab/example/pulse_slab_core_example.dart"
          test -f "$PUBLISH_WORKSPACE/packages/pulse_slab/example/README.md"
          test -f "$PUBLISH_WORKSPACE/packages/pulse_slab_persistence_io/example/file_store_persistence_example.dart"
          test -f "$PUBLISH_WORKSPACE/packages/pulse_slab_persistence_io/example/README.md"
          test -f "$PUBLISH_WORKSPACE/packages/pulse_slab_flutter/example/lib/main.dart"
          test -f "$PUBLISH_WORKSPACE/packages/pulse_slab_flutter/example/README.md"
          test ! -d "$PUBLISH_WORKSPACE/packages/pulse_slab_flutter/example/test"
          test ! -d "$PUBLISH_WORKSPACE/packages/pulse_slab_flutter/demo"
          test -f "$PUBLISH_WORKSPACE/packages/pulse_slab_generator/example/main.dart"
          test -f "$PUBLISH_WORKSPACE/packages/pulse_slab_generator/example/README.md"
          test -f "$PUBLISH_WORKSPACE/packages/pulse_slab_generator/build.yaml"
          for package in pulse_slab pulse_slab_persistence_io pulse_slab_generator pulse_slab_flutter; do
            ! find "$PUBLISH_WORKSPACE/packages/$package/example" -type d \( \
              -name benchmark -o \
              -name fixtures -o \
              -name integration_test -o \
              -name test -o \
              -name tool \
            \) -print -quit | grep -q .
            ! find "$PUBLISH_WORKSPACE/packages/$package/example" -type f \( \
              -name test.dart -o \
              -name '*_test.dart' \
            \) -print -quit | grep -q .
          done
      - name: Resolve isolated publication dependencies
        working-directory: ${{ runner.temp }}/pulse-slab-publish
        run: flutter pub get
      - name: Validate core publication archive
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab
        run: flutter pub publish --dry-run
      - name: Validate persistence I/O publication archive
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab_persistence_io
        run: dart pub publish --dry-run
      - name: Validate Flutter publication archive
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab_flutter
        run: flutter pub publish --dry-run
      - name: Validate generator publication archive
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab_generator
        run: dart pub publish --dry-run
      - name: Upload publication snapshot
        uses: actions/upload-artifact@v4
        with:
          name: publish-packages-${{ github.sha }}
          if-no-files-found: error
          path: publish/

  release_tags:
    name: Create package release tags
    needs: package_snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pub-dev
    permissions:
      contents: write
    concurrency:
      group: release-tags-main
      cancel-in-progress: false
    steps:
      - name: Check out verified main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create missing version tags
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$PREVIOUS_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "::notice::The initial repository push has no previous revision to compare; skipping package release tag creation."
            exit 0
          fi

          if git diff --quiet "$PREVIOUS_SHA" "$GITHUB_SHA" -- \
            packages/pulse_slab packages/pulse_slab_persistence_io packages/pulse_slab_generator packages/pulse_slab_flutter; then
            echo "::notice::No publishable package files changed; skipping package release tag creation."
            exit 0
          fi

          declare -a tags_to_create=()
          for package in pulse_slab pulse_slab_persistence_io pulse_slab_generator pulse_slab_flutter; do
            pubspec="packages/${package}/pubspec.yaml"
            changelog="packages/${package}/CHANGELOG.md"
            version="$(awk -F ': *' '/^version:/ { print $2; exit }' "$pubspec")"

            if ! git cat-file -e "${PREVIOUS_SHA}:${pubspec}" 2> /dev/null; then
              echo "::notice::${package} is new in this revision; a later package-version change is required before it receives a release tag."
              continue
            fi

            previous_version="$(git show "${PREVIOUS_SHA}:${pubspec}" | awk -F ': *' '/^version:/ { print $2; exit }')"
            if [[ "$version" == "$previous_version" ]]; then
              echo "::notice::${package} version is unchanged (${version}); skipping release tag creation."
              continue
            fi

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error file=${pubspec}::Expected a semantic package version, found '$version'."
              exit 1
            fi
            if ! grep -Fqx "## $version" "$changelog"; then
              echo "::error file=${changelog}::Missing a changelog heading for $version."
              exit 1
            fi

            tag="${package}-v${version}"
            legacy_tag="$version"
            if git ls-remote --exit-code --tags origin "refs/tags/${legacy_tag}" > /dev/null 2>&1; then
              echo "::notice::Legacy repository tag ${legacy_tag} exists. It is preserved and is not used for package publishing; using ${tag}."
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
              echo "Release tag ${tag} already exists."
            else
              tags_to_create+=("$tag")
            fi
          done

          if [[ ${#tags_to_create[@]} -eq 0 ]]; then
            echo "::notice::No existing publishable package version changed; skipping package release tag creation."
            exit 0
          fi

          if [[ -z "${RELEASE_TAG_TOKEN:-}" ]]; then
            echo "::error::RELEASE_TAG_TOKEN is required to create tag-triggered pub.dev releases."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add release "https://x-access-token:${RELEASE_TAG_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for tag in "${tags_to_create[@]}"; do
            git tag --annotate "$tag" "$GITHUB_SHA" --message "Release $tag"
          done
          git push release "${tags_to_create[@]}"
