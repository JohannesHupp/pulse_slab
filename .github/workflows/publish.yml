name: Publish tagged package to pub.dev

on:
  push:
    tags:
      - 'pulse_slab-v*'
      - 'pulse_slab_persistence_io-v*'
      - 'pulse_slab_generator-v*'
      - 'pulse_slab_flutter-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: pub-dev-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish_core:
    name: Publish pulse_slab
    if: startsWith(github.ref_name, 'pulse_slab-v')
    runs-on: ubuntu-latest
    environment: pub-dev

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Dart publishing credentials
        uses: dart-lang/setup-dart@v1

      - name: Build isolated publication snapshot
        run: dart tools/prepare_publish_packages.dart

      - name: Copy publication snapshot outside the Git checkout
        env:
          PUBLISH_WORKSPACE: ${{ runner.temp }}/pulse-slab-publish
        run: |
          set -euo pipefail
          rm -rf "$PUBLISH_WORKSPACE"
          mkdir -p "$PUBLISH_WORKSPACE"
          cp -a publish/. "$PUBLISH_WORKSPACE/"
          test -f "$PUBLISH_WORKSPACE/pubspec.yaml"
          test ! -d "$PUBLISH_WORKSPACE/packages/pulse_slab/example"
          test ! -d "$PUBLISH_WORKSPACE/packages/pulse_slab_flutter/example"

      - name: Resolve the isolated workspace
        working-directory: ${{ runner.temp }}/pulse-slab-publish
        run: flutter pub get

      - name: Verify the release tag version
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab
        shell: bash
        run: |
          expected_version="${GITHUB_REF_NAME#pulse_slab-v}"
          actual_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          test "$actual_version" = "$expected_version"

      - name: Validate the publish archive
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab
        run: flutter pub publish --dry-run

      - name: Check whether the core version is already published
        id: core_version
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab
        shell: bash
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          package_url="https://pub.dev/api/packages/pulse_slab/versions/${version}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$package_url")"
          case "$status" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "pulse_slab ${version} already exists on pub.dev; skipping the immutable upload."
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not verify pulse_slab ${version} on pub.dev (HTTP ${status})."
              exit 1
              ;;
          esac

      - name: Publish pulse_slab
        if: steps.core_version.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab
        run: flutter pub publish --force

  create_core_github_release:
    name: Create pulse_slab GitHub release
    needs: publish_core
    if: needs.publish_core.result == 'success'
    runs-on: ubuntu-latest
    environment: pub-dev
    permissions:
      contents: write

    steps:
      - name: Create or reuse the GitHub release
        uses: actions/github-script@v7
        env:
          PACKAGE_NAME: pulse_slab
          PACKAGE_VERSION: ${{ github.ref_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const packageName = process.env.PACKAGE_NAME;
            const tagName = process.env.PACKAGE_VERSION;
            const version = tagName.replace(`${packageName}-v`, '');
            const prerelease = version.includes('-');
            const changelogUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/blob/${tagName}/packages/${packageName}/CHANGELOG.md`;
            const body =
              `Published [\`${packageName}\`](https://pub.dev/packages/${packageName}/versions/${version}) ` +
              `version \`${version}\` to pub.dev.\n\n` +
              `See the [package changelog](${changelogUrl}).`;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              core.notice(`GitHub release for ${tagName} already exists.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tagName,
                  name: `${packageName} ${version}`,
                  body,
                  prerelease,
                });
                core.info(`Created GitHub release for ${tagName}.`);
              } catch (createError) {
                if (createError.status !== 422) {
                  throw createError;
                }
                core.notice(`GitHub release for ${tagName} was created concurrently.`);
              }
            }

  publish_persistence_io:
    name: Publish pulse_slab_persistence_io
    if: startsWith(github.ref_name, 'pulse_slab_persistence_io-v')
    runs-on: ubuntu-latest
    environment: pub-dev

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Dart publishing credentials
        uses: dart-lang/setup-dart@v1

      - name: Build isolated publication snapshot
        run: dart tools/prepare_publish_packages.dart

      - name: Copy publication snapshot outside the Git checkout
        env:
          PUBLISH_WORKSPACE: ${{ runner.temp }}/pulse-slab-publish
        run: |
          set -euo pipefail
          rm -rf "$PUBLISH_WORKSPACE"
          mkdir -p "$PUBLISH_WORKSPACE"
          cp -a publish/. "$PUBLISH_WORKSPACE/"
          test -f "$PUBLISH_WORKSPACE/pubspec.yaml"
          test -d "$PUBLISH_WORKSPACE/packages/pulse_slab_persistence_io"
          test ! -d "$PUBLISH_WORKSPACE/packages/pulse_slab_persistence_io/example"

      - name: Resolve the isolated workspace
        working-directory: ${{ runner.temp }}/pulse-slab-publish
        run: flutter pub get

      - name: Verify the release tag version
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab_persistence_io
        shell: bash
        run: |
          expected_version="${GITHUB_REF_NAME#pulse_slab_persistence_io-v}"
          actual_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          test "$actual_version" = "$expected_version"

      - name: Verify the required core release matches the source API
        shell: bash
        run: |
          set -euo pipefail

          core_constraint="$(awk '$1 == "pulse_slab:" { print $2; exit }' packages/pulse_slab_persistence_io/pubspec.yaml)"
          if [[ ! "$core_constraint" =~ ^\^([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "pulse_slab must use an exact caret version, optionally with a semantic prerelease suffix, before publishing pulse_slab_persistence_io."
            exit 1
          fi

          core_version="${BASH_REMATCH[1]}"
          core_tag="pulse_slab-v${core_version}"
          git fetch --no-tags origin "refs/tags/${core_tag}:refs/tags/${core_tag}"
          if ! git diff --quiet "$core_tag" -- packages/pulse_slab/lib packages/pulse_slab/pubspec.yaml; then
            echo "pulse_slab source differs from ${core_tag}. Publish a matching core release before publishing pulse_slab_persistence_io."
            exit 1
          fi

      - name: Wait for the required core package release
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab_persistence_io
        shell: bash
        run: |
          core_constraint="$(awk '$1 == "pulse_slab:" { print $2; exit }' pubspec.yaml)"
          if [[ ! "$core_constraint" =~ ^\^([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "pulse_slab must use an exact caret version, optionally with a semantic prerelease suffix, before publishing pulse_slab_persistence_io."
            exit 1
          fi

          core_version="${BASH_REMATCH[1]}"
          core_url="https://pub.dev/api/packages/pulse_slab/versions/${core_version}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$core_url" > /dev/null; then
              exit 0
            fi

            echo "Waiting for pulse_slab ${core_version} to become available on pub.dev (attempt ${attempt}/30)."
            sleep 10
          done

          echo "pulse_slab ${core_version} was not available on pub.dev after five minutes."
          exit 1

      - name: Validate the publish archive
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab_persistence_io
        run: dart pub publish --dry-run

      - name: Check whether the persistence I/O version is already published
        id: persistence_io_version
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab_persistence_io
        shell: bash
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          package_url="https://pub.dev/api/packages/pulse_slab_persistence_io/versions/${version}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$package_url")"
          case "$status" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "pulse_slab_persistence_io ${version} already exists on pub.dev; skipping the immutable upload."
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not verify pulse_slab_persistence_io ${version} on pub.dev (HTTP ${status})."
              exit 1
              ;;
          esac

      - name: Publish pulse_slab_persistence_io
        if: steps.persistence_io_version.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/pulse-slab-publish/packages/pulse_slab_persistence_io
        run: dart pub publish --force

  create_persistence_io_github_release:
    name: Create pulse_slab_persistence_io GitHub release
    needs: publish_persistence_io
