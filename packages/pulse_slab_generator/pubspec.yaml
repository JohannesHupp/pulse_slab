name: pulse_slab_generator
description: Optional build-time layout generation for typed Pulse Slab records.
version: 0.3.0-beta.2
resolution: workspace
repository: https://github.com/JohannesHupp/pulse_slab
issue_tracker: https://github.com/JohannesHupp/pulse_slab/issues
topics:
  - codegen
  - typed-data
  - serialization
  - reactive

# This package runs as a native development-time build tool. The generated
# source itself remains portable to every target supported by pulse_slab.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  analyzer: '>=8.1.1 <15.0.0'
  build: ^4.0.6
  build_config: ^1.3.0
  pulse_slab: ^0.3.0-beta.1
  source_gen: ^4.2.4

dev_dependencies:
  build_test: ^3.5.0
  build_runner: ^2.14.1
  lints: ^5.0.0
  test: ^1.25.15
